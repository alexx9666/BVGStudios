<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BVG Studios - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves path and redirects to index.html with query/hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      // If deployed at root or repo subfolder, redirect to index.html
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + (repoName ? repoName + '/' : '') + '?' +
        (path ? 'p=' + encodeURIComponent(path) : '') +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting to BVG Studios...
  </body>
</html>
